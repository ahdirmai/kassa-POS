<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1013" />
    <title>Kassa POS — Mode Offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #efefec;
        color: #111111;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fcfcfb;
        border: 1px solid rgba(17, 17, 17, 0.1);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 24px 48px -28px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 13.5px;
        line-height: 1.55;
        color: #5c5c5a;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: 0;
      }
      .primary {
        background: #111111;
        color: #f7f7f5;
      }
      .ghost {
        background: rgba(17, 17, 17, 0.06);
        color: #111111;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon-192.png" alt="Kassa POS" />
      <h1>Koneksi Internet Terputus</h1>
      <p>
        Halaman ini belum tersimpan untuk akses offline. Anda tetap dapat menggunakan layar
        <strong>Kasir POS</strong> untuk transaksi tunai offline.
      </p>
      <div class="actions">
        <a class="primary" href="/pos">Buka Kasir POS (Offline)</a>
        <button class="ghost" type="button" onclick="window.location.reload()">Coba Muat Ulang</button>
      </div>
    </main>
  </body>
</html>
