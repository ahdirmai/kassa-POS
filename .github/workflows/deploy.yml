name: Deploy to Kassa Server (boxd)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Force rebuild all 5 services"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-kassa-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install boxd CLI
        run: |
          curl -fsSL https://boxd.sh/downloads/install.sh | sh -s -- --yes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Pull & deploy on boxd machine (kassa)
        env:
          BOXD_TOKEN: ${{ secrets.BOXD_TOKEN }}
          REBUILD_ALL: ${{ github.event.inputs.rebuild_all || 'false' }}
        run: |
          boxd machine exec kassa -- bash -c "cd /home/boxd/kassa-POS && OLD_SHA=\$(git rev-parse HEAD) && git fetch origin main && git pull --ff-only origin main && chmod +x docker/deploy.sh && ./docker/deploy.sh ${REBUILD_ALL} \${OLD_SHA}"
