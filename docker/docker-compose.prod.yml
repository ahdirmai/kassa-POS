services:
  mysql:
    image: mysql:8.0
    container_name: tumpu_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos_cafe}
      MYSQL_USER: ${MYSQL_USER:-pos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: tumpu_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: tumpu_api_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-pos_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-pos_cafe}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://pos.tumpu.biz.id,https://tumpu.biz.id}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-7}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-midtrans}
      MIDTRANS_MODE: ${MIDTRANS_MODE:-production}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_API_URL: ${MIDTRANS_API_URL:-https://api.midtrans.com}
      PUBLIC_LANDING_URL: ${PUBLIC_LANDING_URL:-https://tumpu.biz.id}
      APP_WEB_URL: ${APP_WEB_URL:-https://pos.tumpu.biz.id}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-auto}
      EMAIL_FROM: ${EMAIL_FROM:-Tumpu POS <noreply@tumpu.biz.id>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

  admin-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin-api
    container_name: tumpu_admin_api_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      ADMIN_API_PORT: 4001
      DATABASE_URL: mysql://${MYSQL_USER:-pos_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-pos_cafe}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-https://admin.tumpu.biz.id,https://tumpu.biz.id}
      PLATFORM_JWT_ACCESS_SECRET: ${PLATFORM_JWT_ACCESS_SECRET:?PLATFORM_JWT_ACCESS_SECRET is required}
      PLATFORM_JWT_EXPIRES: ${PLATFORM_JWT_EXPIRES:-8h}
      DEPLOY_AGENT_URL: ${DEPLOY_AGENT_URL:-http://host.docker.internal:9000}
      DEPLOY_INTERNAL_TOKEN: ${DEPLOY_INTERNAL_TOKEN:-}

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app-api.tumpu.biz.id/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://app-api.tumpu.biz.id}
        NEXT_PUBLIC_DEMO_MODE: "false"
    container_name: tumpu_web_prod
    restart: unless-stopped
    depends_on:
      - api

  landing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.landing
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://tumpu.biz.id}
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://admin-api.tumpu.biz.id/api/v1}
    container_name: tumpu_landing_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ADMIN_API_URL: http://admin-api:4001/api/v1
      POS_API_URL: http://api:4000/api/v1
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tumpu.biz.id}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    depends_on:
      - api
      - admin-api

  backoffice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backoffice
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://admin-api.tumpu.biz.id/api/v1}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-https://tumpu.biz.id}
    container_name: tumpu_backoffice_prod
    restart: unless-stopped
    depends_on:
      - admin-api

  nginx:
    image: nginx:1.27-alpine
    container_name: tumpu_nginx_prod
    restart: unless-stopped
    depends_on:
      - web
      - api
      - admin-api
      - landing
      - backoffice
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_prod_data:
  redis_prod_data:
