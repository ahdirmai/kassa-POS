services:
  mysql:
    image: mysql:8.0
    container_name: kassa_mysql_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos_cafe}
      MYSQL_USER: ${MYSQL_USER:-pos_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_db_pwd}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: kassa_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: kassa_api_prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: mysql://${MYSQL_USER:-pos_user}:${MYSQL_PASSWORD:-change_db_pwd}@mysql:3306/${MYSQL_DATABASE:-pos_cafe}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://app.kassa.biz.id,https://kassa.biz.id,https://admin.kassa.biz.id}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES_DAYS: 7

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://app.kassa.biz.id/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://app.kassa.biz.id}
    container_name: kassa_web_prod
    restart: unless-stopped
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    container_name: kassa_nginx_prod
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_prod_data:
  redis_prod_data:
