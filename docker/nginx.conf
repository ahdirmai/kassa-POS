events {}

http {
  server_tokens off;
  proxy_hide_header X-Powered-By;

  # Cloudflare proxy real visitor IP & original HTTPS scheme preservation
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  map $http_cf_connecting_ip $client_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
  }

  # Anti-spam rate limiting untuk register & kirim ulang email verifikasi
  limit_req_zone $client_real_ip zone=tumpu_auth_email_cf:10m rate=5r/m;
  limit_req_status 429;

  upstream app_api_upstream {
    server api:4000;
  }

  upstream admin_api_upstream {
    server admin-api:4001;
  }

  upstream app_web_upstream {
    server web:3000;
  }

  upstream landing_upstream {
    server landing:3005;
  }

  upstream admin_web_upstream {
    server backoffice:3006;
  }

  # 1. Landing Page (tumpu.biz.id)
  server {
    listen 80;
    server_name tumpu.biz.id www.tumpu.biz.id;

    add_header X-Frame-Options "DENY" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@tumpu.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://tumpu.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://landing_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # 2. POS Web App (pos.tumpu.biz.id)
  server {
    listen 80;
    server_name pos.tumpu.biz.id;

    add_header X-Frame-Options "DENY" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@tumpu.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://tumpu.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://app_web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # 3. POS API + Socket.IO (app-api.tumpu.biz.id)
  server {
    listen 80;
    server_name app-api.tumpu.biz.id;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@tumpu.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://tumpu.biz.id/.well-known/security.txt\n";
    }

    location /socket.io/ {
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Anti-spam rate limit ketat untuk register & resend email verifikasi (5 req/menit/IP)
    location ~ ^/api/v1/auth/(register|resend-verification)$ {
      limit_req zone=tumpu_auth_email_cf burst=3 nodelay;
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # 4. Back Office Web (admin.tumpu.biz.id)
  server {
    listen 80;
    server_name admin.tumpu.biz.id;

    add_header X-Frame-Options "DENY" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@tumpu.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://tumpu.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://admin_web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # 5. Back Office API (admin-api.tumpu.biz.id)
  server {
    listen 80;
    server_name admin-api.tumpu.biz.id;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@tumpu.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://tumpu.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://admin_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $client_real_ip;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }

  # 6. Legacy Redirects (kassa.biz.id & app.tumpu.biz.id -> Tumpu primary domains)
  server {
    listen 80;
    server_name kassa.biz.id www.kassa.biz.id;
    return 301 https://tumpu.biz.id$request_uri;
  }

  server {
    listen 80;
    server_name app.tumpu.biz.id app.kassa.biz.id;
    return 301 https://pos.tumpu.biz.id$request_uri;
  }

  server {
    listen 80;
    server_name admin.kassa.biz.id;
    return 301 https://admin.tumpu.biz.id$request_uri;
  }
}
