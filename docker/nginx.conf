events {}

http {
  server_tokens off;
  proxy_hide_header X-Powered-By;

  # Anti-spam rate limiting untuk register & kirim ulang email verifikasi
  limit_req_zone $binary_remote_addr zone=kassa_auth_email:10m rate=5r/m;
  limit_req_zone $http_x_forwarded_for zone=kassa_auth_email_xff:10m rate=5r/m;
  limit_req_status 429;

  upstream app_api_upstream {
    server api:4000;
  }

  upstream admin_api_upstream {
    server admin-api:4001;
  }

  upstream app_web_upstream {
    server web:3000;
  }

  upstream landing_upstream {
    server landing:3005;
  }

  upstream admin_web_upstream {
    server backoffice:3006;
  }

  # 1. Landing Page (kassa.biz.id)
  server {
    listen 80;
    server_name kassa.biz.id www.kassa.biz.id;

    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@kassa.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://kassa.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://landing_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 2. POS Web App (app.kassa.biz.id)
  server {
    listen 80;
    server_name app.kassa.biz.id;

    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@kassa.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://kassa.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://app_web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 3. POS API + Socket.IO (app-api.kassa.biz.id)
  server {
    listen 80;
    server_name app-api.kassa.biz.id;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@kassa.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://kassa.biz.id/.well-known/security.txt\n";
    }

    location /socket.io/ {
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Anti-spam rate limit ketat untuk register & resend email verifikasi (5 req/menit/IP)
    location ~ ^/api/v1/auth/(register|resend-verification)$ {
      limit_req zone=kassa_auth_email_xff burst=3 nodelay;
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 4. Back Office Web (admin.kassa.biz.id)
  server {
    listen 80;
    server_name admin.kassa.biz.id;

    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@kassa.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://kassa.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://admin_web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # 5. Back Office API (admin-api.kassa.biz.id)
  server {
    listen 80;
    server_name admin-api.kassa.biz.id;

    location = /.well-known/security.txt {
      default_type text/plain;
      return 200 "Contact: mailto:security@kassa.biz.id\nExpires: 2027-11-22T00:00:00.000Z\nPreferred-Languages: id, en\nCanonical: https://kassa.biz.id/.well-known/security.txt\n";
    }

    location / {
      proxy_pass http://admin_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
